$schema: 'https://moonrepo.dev/schemas/project.json'

stack: 'frontend'
language: 'typescript'

tasks:
  dev:
    command: 'bun run dev'
    preset: 'server'

  build:
    command: 'bun run build'
    inputs:
      - 'src/**/*'
      - 'public/**/*'
      - 'astro.config.mjs'
      - 'tsconfig.json'
    outputs:
      - 'dist'

  preview:
    command: 'bun run preview'
    preset: 'server'

  typecheck:
    command: 'bun run typecheck'
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'

name: Asterisk Continuous Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Run Migrations & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Monorepo Dependencies
        run: bun install

      - name: Run Drizzle Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd apps/backend
          bun run db:migrate

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "==== Asterisk Backend Deployment Starting ===="
            cd /home/ubuntu/asterisk
            git fetch origin
            git reset --hard origin/main
            sudo docker build -f apps/backend/Dockerfile -t asterisk-backend:latest .
            sudo docker stop asterisk-backend || true
            sudo docker rm asterisk-backend || true
            sudo docker run -d \
              --name asterisk-backend \
              --restart unless-stopped \
              --env-file /home/ubuntu/.env \
              -p 3001:3001 \
              asterisk-backend:latest
            sudo systemctl reload nginx
            echo "==== Asterisk Backend Deployment Completed ===="

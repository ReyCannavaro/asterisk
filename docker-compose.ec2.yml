services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: asterisk-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 3
